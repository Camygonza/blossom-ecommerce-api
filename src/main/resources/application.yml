server:
  # detrás de nginx: la IP real del cliente (rate limit de login) sale de X-Forwarded-For, solo si el proxy es interno
  forward-headers-strategy: native

spring:
  application:
    name: ecommerce-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bloom}
    username: ${DB_USER:bloom}
    password: ${DB_PASSWORD:bloom}
  jpa:
    open-in-view: false
    properties:
      hibernate.default_batch_fetch_size: 50   # evita N+1 al paginar órdenes con sus ítems
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        default-page-size: 12
        max-page-size: 50
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    login:
      rate-limit-max-requests: ${LOGIN_RATE_LIMIT_MAX:10}   # intentos por IP...
      rate-limit-window-seconds: 60                         # ...por ventana de 60 s
      lock-max-failed-attempts: 5                           # fallos consecutivos para bloquear la cuenta
      lock-duration-minutes: 15

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"   # requestId lo pone RequestIdFilter

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
