# Levanta PostgreSQL + API + Web. Requiere el repo del web clonado junto a este:
#   blossom-ecommerce-api/   (este)
#   blossom-ecommerce-web/
# Uso: cp env.ejemplo .env  (y rellenar los valores)  →  docker compose up --build
# Web: http://localhost:3000 · API/Swagger: http://localhost:8080/swagger-ui.html
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bloom
      POSTGRES_USER: bloom
      POSTGRES_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env}
    volumes:
      - bloom-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloom -d bloom"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/bloom
      DB_USER: bloom
      DB_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env (mínimo 32 caracteres)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      # la imagen JRE no trae curl: se abre un socket y se pide el health con bash
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build: ../blossom-ecommerce-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  bloom-data:
