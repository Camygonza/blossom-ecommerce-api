# Blueprint de Render: PostgreSQL + API + Web (el web se construye desde su propio repositorio).
# Despliegue: Render → New → Blueprint → elegir este repositorio. Ver «Despliegue en Render» en el README.
# Render añade un sufijo al dominio si el nombre está tomado (aquí bloom-api-fx8a y bloom-web-ah8o). Si se recrea el
# Blueprint, actualiza esas URLs en API_UPSTREAM, API_HOST y CORS_ALLOWED_ORIGINS.
databases:
  - name: bloom-db
    plan: free
    databaseName: bloom
    user: bloom

services:
  - type: web
    name: bloom-api
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: bloom-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://bloom-web-ah8o.onrender.com
      # el web llega con una IP de la plataforma: el límite por IP se sube para que varios evaluadores no se bloqueen
      - key: LOGIN_RATE_LIMIT_MAX
        value: "300"

  - type: web
    name: bloom-web
    runtime: docker
    plan: free
    repo: https://github.com/Camygonza/blossom-ecommerce-web
    envVars:
      - key: API_UPSTREAM
        value: https://bloom-api-fx8a.onrender.com
      - key: API_HOST
        value: bloom-api-fx8a.onrender.com
