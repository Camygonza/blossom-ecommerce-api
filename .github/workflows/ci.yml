name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # verify = compilar + tests (Testcontainers usa el Docker del runner) + gate JaCoCo >= 80 %
      - name: Verificar
        run: ./mvnw -B verify
      - name: Informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: target/site/jacoco

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t bloom-api:ci .
